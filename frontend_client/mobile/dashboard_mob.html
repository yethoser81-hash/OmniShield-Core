<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniShield - Mobile</title>
    <style>
        :root { --bg: #0b0f19; --card: #111827; --accent: #3b82f6; --alert: #ef4444; --text: #f9fafb; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
        .logo { width: 32px; height: 32px; }
        .card { background: var(--card); border: 1px solid #1f2937; border-radius: 12px; padding: 15px; margin-top: 15px; }
        button { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        button.danger { background: var(--alert); }
        .log { background: #030712; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; height: 100px; overflow-y: auto; color: #9ca3af; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="../assets/logo_omni.png" alt="Logo" class="logo">
            <h2 style="margin:0; font-size:20px; color:var(--accent);">OmniShield Mobile</h2>
        </div>
        <span id="mob-status" style="font-size:12px; color:#10b981;">● Actif</span>
    </header>

    <div class="card">
        <h3>Bouclier Mobile Money & SMS</h3>
        <p style="font-size:14px; color:#9ca3af;">Surveillance active des requêtes USSD et des arnaques textuelles.</p>
        <button onclick="mobScan()">Analyser l'appareil</button>
    </div>

    <div class="card">
        <h3>Piège Antivol</h3>
        <button class="danger" onclick="mobTrap()">Activer la trappe photo</button>
    </div>

    <div class="card">
        <h3>Journaux Live</h3>
        <div id="mob-logs" class="log">[MOBILE] Surveillance active lancée...</div>
    </div>

    <script>
        function mobScan() {
            document.getElementById('mob-logs').innerHTML += "<br>[SCAN] Vérification des SMS et Mobile Money OK.";
        }
        function mobTrap() {
            document.getElementById('mob-logs').innerHTML += "<br>⚠️ [PIÈGE] Caméra frontale armée à distance.";
        }
    </script>
</body>
</html>
